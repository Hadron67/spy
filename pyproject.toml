[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spy"
version = "0.1.0"
description = "System Python: JIT-compile Python functions into machine code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # the OrcJIT (LLJIT) bindings this backend uses were added in 0.36
    "llvmlite>=0.36",
]

[tool.setuptools.packages.find]
include = ["spy*"]
exclude = ["spy.tests*"]
